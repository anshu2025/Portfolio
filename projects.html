<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects | Utkarsh</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    color:white;
    overflow-x:hidden;
}

/* 🌌 Parallax Background */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background:radial-gradient(circle at 20% 20%,#3b82f6,transparent),
               radial-gradient(circle at 80% 80%,#9333ea,transparent),
               radial-gradient(circle at 50% 50%,#f43f5e,transparent);
    animation:moveBg 20s linear infinite;
    z-index:-1;
    opacity:0.2;
}

@keyframes moveBg{
    0%{transform:translate(0,0);}
    50%{transform:translate(-100px,-100px);}
    100%{transform:translate(0,0);}
}

h1{
    text-align:center;
    margin:60px 0;
    font-size:40px;
    letter-spacing:2px;
}

/* Grid */
.projects{
     display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:50px;
    padding:0 8% 80px;
    max-width:1400px;
    margin:auto;
}

/* Card */
.card{
 display:block;
    position:relative;
    border-radius:20px;
    overflow:hidden;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    transition:0.6s ease;
    cursor:pointer;
    transform:translateY(50px);
    opacity:0;
    text-decoration: none;   /* underline remove */
    color: inherit; 
}

/* Scroll Reveal */
.card.show{
    transform:translateY(0);
    opacity:1;
}

.card:hover{
    transform:translateY(-12px) scale(1.03);
     box-shadow:0 10px 40px rgba(147,51,234,0.5);
}

/* Image + Video Container */
.media{
    position:relative;
    width:100%;
    height:260px;
    overflow:hidden;
}

.media img,
.media video{
    width:100%;
    height:100%;
    object-fit:cover;
    position:absolute;
    top:0;
    left:0;
     transition:opacity 0.4s ease;
}

/* Video hidden initially */
.media video{
    opacity:0;
    pointer-events: none;
}

/* On hover show video */
.card:hover .media video{
    opacity:1;
}

.card:hover .media img{
    opacity:0;
}

.card-content{
    padding:20px;
}

.card h3{
     color: white;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1px;
    transition: 0.4s;
    font-size:22px;
}
.card:hover h3 {
    background: linear-gradient(45deg, #3b82f6, #9333ea);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;

    filter: drop-shadow(0 0 8px rgba(147,51,234,0.7));
    /* better glow */
    text-shadow: 0 0 10px rgba(147,51,234,0.6);
}

.card p{
    margin:15px 0 ;
    color:#cbd5e1;
    font-size:14px;
    line-height:1.6;
}

/* Premium Button */
.live-btn {
    margin-top: 10px;
    display:inline-block;
    padding:10px 20px;
    border-radius:30px;
    font-weight:600;
    text-decoration:none;
    color:white;
    background:linear-gradient(135deg,#3b82f6,#9476b1);
     font-size:14px;
    box-shadow:0 0 15px rgba(59,130,246,0.5);
    transition:0.3s;
}

.live-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 35px rgba(119, 34, 204, 0.9);
}

.card:hover .live-btn{
    transform:scale(1.05);
}

@media (max-width: 500px) {
    h1 {
        font-size: 28px;
    }

    .projects {
        padding: 0 5% 60px;
    }

    .card-content {
        padding: 18px;
    }

    .card h3 {
        font-size: 18px;
    }

   
}
</style>
</head>

<body>

<h1>🚀 My Projects</h1>

<section class="projects">

    <!-- PROJECT 1 -->
    <a href="https://explorebyanshu.vercel.app" target="_blank" class="card">
        <div class="media">
            <img src="./img&vedio/explore.png">
           
        </div>

        <div class="card-content">
            <h3>Explore India Website</h3>
            <span class="live-btn">🔥 Live Demo</span>
        </div>
    </a>

    <!-- PROJECT 2 -->
    <a href="https://anshu-rusy.vercel.app/" target="_blank" class="card">
        <div class="media">
            <img src="./img&vedio/Portimg1.png">
           
        </div>

        <div class="card-content">
            <h3>Portfolio Website</h3>
            <span class="live-btn">🔥 Live Demo</span>
        </div>
    </a>

    <!-- PROJECT 3 (NEW) -->
    <a href="https://milkserve.vercel.app/" target="_blank" class="card">
        <div class="media">
            <img src="./img&vedio/Milk UI.png">
           
        </div>

        <div class="card-content">
            <h3>Milk Management System</h3>
            <span class="live-btn">🔥 Live Demo</span>
        </div>
    </a>

</section>

<script>
/* Scroll Reveal Animation */
const cards = document.querySelectorAll(".card");

const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

cards.forEach(card=>{
    observer.observe(card);
});

/* Auto play video on hover */
document.querySelectorAll(".card").forEach(card=>{
    const video = card.querySelector("video");

    if(video){
        card.addEventListener("mouseenter",()=>{
            video.currentTime = 0;
            video.play();
        });

        card.addEventListener("mouseleave",()=>{
            video.pause();
        });
    }
});
</script>

</body>
</html>
