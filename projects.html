<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects | Utkarsh</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    color:white;
    overflow-x:hidden;
}

/* 🌌 Parallax Background */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background:radial-gradient(circle at 20% 20%,#3b82f6,transparent),
               radial-gradient(circle at 80% 80%,#9333ea,transparent),
               radial-gradient(circle at 50% 50%,#f43f5e,transparent);
    animation:moveBg 20s linear infinite;
    z-index:-1;
    opacity:0.2;
}

@keyframes moveBg{
    0%{transform:translate(0,0);}
    50%{transform:translate(-100px,-100px);}
    100%{transform:translate(0,0);}
}

h1{
    text-align:center;
    margin:60px 0;
    font-size:40px;
    letter-spacing:2px;
}

/* Grid */
.projects{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:40px;
    padding:0 10% 80px;
}

/* Card */
.card{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    transition:0.6s;
    cursor:pointer;
    transform:translateY(50px);
    opacity:0;
    text-decoration: none;   /* underline remove */
    color: inherit; 
}

/* Scroll Reveal */
.card.show{
    transform:translateY(0);
    opacity:1;
}

.card:hover{
    transform:translateY(-15px) scale(1.03);
    box-shadow:0 0 40px rgba(150, 98, 199, 0.7);
}

/* Image + Video Container */
.media{
    position:relative;
    width:100%;
    height:320px;
    overflow:hidden;
}

.media img,
.media video{
    width:100%;
    height:100%;
    object-fit:cover;
    position:absolute;
    top:0;
    left:0;
    transition:0.5s;
}

/* Video hidden initially */
.media video{
    opacity:0;
}

/* On hover show video */
.card:hover .media video{
    opacity:1;
}

.card:hover .media img{
    opacity:0;
}

.card-content{
    padding:25px;
}

.card h3{
     color: white;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1px;
    transition: 0.4s;
    font-size:22px;
}
.card:hover h3 {
    background: linear-gradient(45deg, #3b82f6, #b791db);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 15px rgba(43, 204, 18, 0.8);
}

.card p{
    margin:15px 0 ;
    color:#cbd5e1;
    font-size:14px;
    line-height:1.6;
}

/* Premium Button */
.live-btn a{
    margin-top: 15px;
    display:inline-block;
    padding:12px 25px;
    border-radius:50px;
    font-weight:600;
    text-decoration:none;
    color:white;
    background:linear-gradient(135deg,#3b82f6,#9333ea);
    transition:0.4s;
    box-shadow:0 0 20px rgba(59,130,246,0.6);
}

.live-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 35px rgba(147,51,234,0.9);
}

@media (max-width: 500px) {
    h1 {
        font-size: 28px;
    }

    .projects {
        padding: 0 5% 60px;
    }

    .card-content {
        padding: 18px;
    }

    .card h3 {
        font-size: 18px;
    }

   
}
</style>
</head>

<body>

<h1>🚀 My Projects</h1>

<section class="projects">

    <!-- PROJECT CARD -->
    <a href="https://yourlivelink.com" target="_blank" class="card">

        <div class="media">
            <img src="./img&vedio/explore.png" alt="Project Image">
            <!-- Optional Video Preview -->
            <video src="./img&vedio/exploreV.mp4" muted loop></video>
        </div>

        
    </a>
    <div class="card-content">
        <h3>Explore India Website</h3>
        
        <span class="live-btn"><a href="https://explorebyanshu.vercel.app" target="_blank" rel="noopener noreferrer">🔥 Live Demo</a></span>
    </div>
    <a href="https://yourlivelink.com" target="_blank" class="card">

        <div class="media">
            <img src="./img&vedio/Portimg1.png" alt="Project Image">
            <!-- Optional Video Preview -->
            <video src="./img&vedio/portfoliodemo.mp4" muted loop></video>
        </div>

        
    </a>
    <div class="card-content">
        <h3>Portfolio Website</h3>
        
        <span class="live-btn"><a href="https://anshu-rusy.vercel.app/" target="_blank" rel="noopener noreferrer">🔥 Live Demo</a></span>
    </div>

</section>

<script>
/* Scroll Reveal Animation */
const cards = document.querySelectorAll(".card");

const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

cards.forEach(card=>{
    observer.observe(card);
});

/* Auto play video on hover */
document.querySelectorAll(".card").forEach(card=>{
    const video = card.querySelector("video");
    card.addEventListener("mouseenter",()=>{
        if(video) video.play();
    });
    card.addEventListener("mouseleave",()=>{
        if(video){
            video.pause();
            video.currentTime = 0;
        }
    });
});
</script>

</body>
</html>
